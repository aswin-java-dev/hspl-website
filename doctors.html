<!DOCTYPE html>
<html lang="en">
<head>
    <title>doctors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section>
    <div class="section-title">
        <h2>Our Doctors</h2>
    </div>

    <div class="doctors-grid">
        <div class="doctor-card">
            <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?auto=format&fit=crop&w=700&q=80">
            <div class="doctor-info">
                <h3>Dr. John Smith</h3>
                <p>Cardiologist</p>
            </div>
        </div>

        <div class="doctor-card">
            <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=700&q=80">
            <div class="doctor-info">
                <h3>Dr. Sarah Johnson</h3>
                <p>Neurologist</p>
            </div>
        </div>

        <div class="doctor-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbf3nkYjxLL79pgGQclq-K7_YLIaNuEUelgEaDzmBbtraWDgEuUNO9flRP&s=10">
            <div class="doctor-info">
                <h3>Dr. Elizabeth Hawkes</h3>
                <p>Orthopedic Surgeon</p>
            </div>
        </div>
    </div>
</section>

<section class="stats">
    <div class="stats-grid">
        <div class="stat">
            <h2>50+</h2>
            <p>Doctors</p>
        </div>

        <div class="stat">
            <h2>20K+</h2>
            <p>Patients</p>
        </div>

        <div class="stat">
            <h2>15+</h2>
            <p>Departments</p>
        </div>

        <div class="stat">
            <h2>24/7</h2>
            <p>Support</p>
        </div>
    </div>
</section>

</body>
</html>
